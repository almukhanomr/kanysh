[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kanysh-basic"
version = "0.2.0.dev1"
description = "MCP server for subsurface modeling + local web viewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pint>=0.24,<1",
  "pyproj>=3.7,<4",
  "lasio>=0.31,<1",
  "segyio>=1.9.13,<2",
  "gstools>=1.7,<2",
  "gempy>=2024.2,<2027",
  "torch>=2.6,<3",
  "dask[distributed]>=2025.1,<2027",
  "matplotlib>=3.9,<4",
  "mcp>=1.12,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pyarrow>=19,<24",
  "zarr>=2.18,<3",
  "itsdangerous>=2.2,<3",
  "xtgeo>=4.6,<5",
  "shapely>=2,<3",
  "openpyxl>=3.1,<4",
  "reportlab>=4,<5",
  "pypdf>=6,<7",
]

[project.urls]
Homepage = "https://kanysh.com"

[project.optional-dependencies]
ui = ["gradio>=5.30,<6", "plotly>=6,<7"]
viewer = [
    "nest-asyncio2>=1.6,<2",
    "pyvista>=0.45,<1",
    "trame>=3.9,<4",
    "trame-pyvista>=0.1,<1",
    "trame-vtk>=2.9,<3",
]
solver = ["resdata>=6,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "pytest-asyncio>=0.26,<2", "playwright>=1.51,<2"]

[project.scripts]
kanysh-basic = "opensubsurface.cli:main"
opensubsurface = "opensubsurface.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: требует NVIDIA CUDA", "opm: требует OPM Flow", "external: требует внешних сервисов", "experimental: исключённые из продукта эксперименты"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/opensubsurface"]

[tool.hatch.build]
exclude = ["/experimental", "/docs/copilot-distribution.json"]
