name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      PYVISTA_OFF_SCREEN: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Linux rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 fonts-dejavu-core
      - name: Install locked development dependencies
        run: uv sync --frozen --extra ui --extra viewer --extra solver --group dev
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts examples/generators
      - name: Audit publication candidates
        run: uv run --no-sync python scripts/check_publication.py --report test-results/publication-audit.json
      - name: CPU tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync pytest -q --basetemp="${{ runner.temp }}/pytest" -m "not gpu and not opm and not external" --junitxml=test-results/junit-linux.xml
      - name: CPU tests on macOS
        if: runner.os == 'macOS'
        run: uv run --no-sync pytest -q --basetemp="${{ runner.temp }}/pytest" -m "not gpu and not opm and not external" --junitxml=test-results/junit-macos.xml
      - name: CPU tests on Windows
        if: runner.os == 'Windows'
        run: uv run --no-sync pytest -q --basetemp="${{ runner.temp }}/pytest" -m "not gpu and not opm and not external" --junitxml=test-results/junit-windows.xml
      - name: Upload portable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          retention-days: 7
          path: test-results/junit-*.xml
          if-no-files-found: ignore

      - name: Upload failed worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ matrix.os }}
          retention-days: 7
          path: ${{ runner.temp }}/pytest/**/attempts/**/worker.log
          if-no-files-found: warn

      - name: Upload failed Desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-logs-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/pytest/**/startup*.json
            ${{ runner.temp }}/pytest/**/startup.log
            ${{ runner.temp }}/pytest/**/viewer.log
            ${{ runner.temp }}/pytest/**/viewer-process.json
            ${{ runner.temp }}/pytest/**/desktop-leases/*.json
            ${{ runner.temp }}/pytest/**/*-client.log
          if-no-files-found: ignore
