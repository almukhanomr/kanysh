name: Bug report
description: Something fails, crashes or behaves differently from the documentation.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please do **not** attach confidential reservoir data.
        The quickest way to give us what we need: ask your chat to run the `support_report`
        tool (or run `kanysh-basic support-report`), open the ZIP it creates, check it, and
        drag it into the field below. It contains versions, error codes and redacted logs only.
  - type: input
    id: version
    attributes:
      label: Kanysh version
      description: Shown by the `diagnostics` tool (versions.kanysh-basic), e.g. 0.2.0.dev7.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Claude Desktop extension, CPU (.mcpb)
        - Claude Desktop extension, GPU (.mcpb)
        - From source (uv)
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Windows + WSL2 (OPM Flow)
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - ChatGPT
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool or step, the error code and message, and what you expected instead.
      placeholder: "regional_volumes failed with WORKER_CRASH after import of a 3M-cell EGRID…"
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data involved (no confidential details)
      description: Format and size, e.g. "ECLIPSE EGRID+INIT exported from Petrel 2023, 3.1M cells". Public or synthetic example welcome.
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: Drag the kanysh-support-*.zip here after reviewing it. Leave empty if you prefer not to share it.
