[project]
name = "kanysh-basic-mcpb"
version = "0.2.0.dev3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "portalocker>=3.2,<4",
  "psutil>=7,<8",
  "scipy>=1.13,<2",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pint>=0.24,<1",
  "pyproj>=3.7,<4",
  "lasio>=0.31,<1",
  "segyio>=1.9.13,<2",
  "gstools>=1.7,<2",
  "gempy>=2024.2,<2027",
  "torch>=2.6,<3",
  "dask[distributed]>=2025.1,<2027",
  "matplotlib>=3.9,<4",
  "mcp>=1.12,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pyarrow>=19,<24",
  "zarr>=2.18,<3",
  "itsdangerous>=2.2,<3",
  "xtgeo>=4.6,<5",
  "shapely>=2,<3",
  "openpyxl>=3.1,<4",
  "reportlab>=4,<5",
  "pypdf>=6,<7",
  "gradio>=5.30,<6",
  "plotly>=6,<7",
  "nest-asyncio2>=1.6,<2",
  "pyvista>=0.45,<1",
  "trame>=3.9,<4",
  "trame-pyvista>=0.1,<1",
  "trame-vtk>=2.9,<3"
]

[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
